
<!DOCTYPE html>

<head>
    <title> Final Cart </title>
</head>

<body>

<div class="payment-box">

    <h1>
        💳 Payment
    </h1>

<div class="total">

        Total Amount:
        ₹<span id="total"></span>

    </div>


    <h3>
        Select Payment Method
    </h3>


    <!-- PHONEPE -->
<a href="phonepe.html">
    <button class="payment-button phonepe"
            onclick="payWithUPI()" >

        📱 Pay with PhonePe

    </button>
</a>

    <!-- GOOGLE PAY -->

    <button class="payment-button googlepay"
            onclick="payWithUPI()">

        📱 Pay with Google Pay

    </button>


    <!-- PAYTM -->

    <button class="payment-button paytm"
            onclick="payWithUPI()">

        💳 Pay with Paytm

    </button>


    <!-- UPI -->

    <button class="payment-button upi"
            onclick="payWithUPI()">

        🔗 Pay using UPI

    </button>


    <!-- CASH ON DELIVERY -->

    <button class="payment-button cod"
            onclick="cashOnDelivery()">

        💵 Cash on Delivery

    </button>


    <button class="payment-button back"
            onclick="goBack()">

        ← Back to Products

    </button>


</div>




</body>
  <style>


<style>

        }

        .payment-box {

            max-width: 450px;

        .order-details {

        .total {

            font-size: 28px;

        }

        .payment-button {

            display: block;

            width: 100%;

            padding: 15px;

            color: white;

        }

        .phonepe {

            background-color: #5f259f;

        .googlepay {

        }

        .paytm {

        }

  <script>

  let total =
        localStorage.getItem("total");
         document.getElementById("total")
        .innerText =
        total;


 function payWithUPI() {

        /*
            Replace this with your real
            UPI ID.
        */

        let upiID =
            "yourupi@upi";


        let merchantName =
            "Varahi Milk Products";


        /*
            Create UPI payment link.
        */

        let upiLink =
            "upi://pay" +
            "?pa=" +
            encodeURIComponent(upiID) +
            "&pn=" +
            encodeURIComponent(merchantName) +
            "&am=" +
            encodeURIComponent(total) +
            "&cu=INR";


        /*
            Open UPI application.
        */

        window.location.href =
            upiLink;

    }


    // =========================
    // CASH ON DELIVERY
    // =========================

    function cashOnDelivery() {

        alert(
            "Cash on Delivery selected.\n\n" +

            "Product: " +
            product +

            "\nQuantity: " +
            quantity +

            "\nTotal Amount: ₹" +
            total +

            "\n\nYour order has been placed."
        );

    }


   

    function goBack() {

        window.location.href =
            "index.html";

    }











  </script>
